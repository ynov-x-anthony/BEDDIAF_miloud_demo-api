# CI/CD demo-api : 2 services métier (api, notifier) buildés, scannés et publiés séparément,
# puis déploiement continu de la stack sur chaque tag v*.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: image (${{ matrix.service }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: Dockerfile.multi
          - service: notifier
            dockerfile: Dockerfile
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      # Actions épinglées par SHA de commit (le tag est en commentaire)
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GHCR exige un nom d'image en minuscules
      - name: Nom de l'image
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}" >> "$GITHUB_ENV"
          if [ "$IS_RELEASE" = "true" ]; then echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"; else echo "TAG=ci" >> "$GITHUB_ENV"; fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/${{ matrix.dockerfile }}
          load: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}

      - name: Scan Trivy ${{ matrix.service }} (gate sur les tags v*)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.TAG }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: ${{ env.IS_RELEASE == 'true' && '1' || '0' }}
          format: table

      - name: Login GHCR (tags seulement)
        if: env.IS_RELEASE == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On pousse l'image EXACTE qui vient d'être scannée (pas de rebuild)
      - name: Push ${{ matrix.service }} (tags seulement)
        if: env.IS_RELEASE == 'true'
        run: docker push "$IMAGE:$TAG"

  # Déploiement continu. Pas de VM disponible : la cible est simulée sur le runner GitHub
  # (variante autorisée par la quête). La mécanique est celle d'un vrai serveur :
  # docker compose pull des images publiées par le job image, puis up -d, sans aucun build.
  deploy:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout (compose.yml, db/init.sql)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Préparer la cible (.env + secret)
        run: |
          grep -vE '^#?(IMAGE_PREFIX|TAG)=' .env.example > .env
          echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> .env
          echo "TAG=${GITHUB_REF_NAME}" >> .env
          mkdir -p secrets
          openssl rand -hex 16 > secrets/db_password.txt

      - name: docker compose pull && docker compose up -d
        run: |
          docker compose pull
          docker compose up -d --no-build --wait
          docker compose ps
          docker compose images

      - name: Smoke test de la stack déployée
        run: |
          curl -fsS localhost:8080/ && echo
          curl -fsS localhost:8080/products && echo
          curl -fsS -X POST localhost:8080/products -H "Content-Type: application/json" \
            -d '{"name":"Clavier meca","price_cents":5900}' && echo
          sleep 2
          docker compose logs notifier | tail -5
          docker compose logs notifier | grep -q "Clavier meca"
          echo "OK : notifier a reçu la notification"

      - name: Panne de notifier (POST /products doit rester en 201)
        run: |
          docker compose stop notifier
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST localhost:8080/products \
            -H "Content-Type: application/json" -d '{"name":"Souris","price_cents":2500}')
          echo "POST /products avec notifier arrêté -> HTTP $code"
          test "$code" = "201"
          docker compose start notifier

      - name: Nettoyage
        if: always()
        run: docker compose down -v
